# 消息队列配置
mq:
  kafka:
    bootstrap_servers: "localhost:9092"
    group_id: "xxxx"

# Redis配置
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: null

# 执行配置
execution:
  max_retry: 3
  retry_delay: 2
  timeout: 300
  parallel_enabled: true
  max_parallel_workers: 5

# 报告配置
report:
  output_dir: "reports"
  format: "html"  # html, json, markdown
  include_screenshots: false
  include_logs: true

# 日志配置
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/test.log"
  rotation: "100 MB"
  retention: "30 days"

